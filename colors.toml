# Omarchy 4 semantic palette roles. Keep these aligned with color0-color15.
mode = "dark"
bg = "#0b0d11"
lighter_bg = "#19171c"
selection = "#ff69b4"
# Readable low-emphasis text; dark_fg remains the decorative structural green.
muted = "#674242"
dark_fg = "#4a5d46"
fg = "#ffffff"
light_fg = "#ffffff"
soft_fg = "#d8c6cc"
bright_fg = "#ffffff"
red = "#ff69b4"
green = "#ff1493"
yellow = "#ffb6c1"
blue = "#db7093"
magenta = "#ffffff"
cyan = "#ffb6c1"
orange = "#ffb6c1"
brown = "#6c5f4b"
dark_bg = "#080a0d"
darker_bg = "#060709"
bright_red = "#ff0000"
bright_green = "#ff69b4"
bright_yellow = "#ffb6c1"
bright_blue = "#ff1493"
bright_magenta = "#db7093"
bright_cyan = "#ff85b3"

# Quattro shares these gradients between Hyprland and shell surfaces.
hyprland_active_border = "rgba(ff69b4ee) rgba(ffffffcc) rgba(db7093aa) 35deg"
hyprland_inactive_border = "rgba(67424299)"

